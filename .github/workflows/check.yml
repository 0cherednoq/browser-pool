name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # release.yml: перед выпуском — тот же полный набор

permissions:
  contents: read

# Новый push в ту же ветку отменяет прежний прогон: ждать устаревший результат незачем.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Страж процессов и пути — платформенные: гоняем обе ОС с самого начала.
    # Полный набор — на новейшем Python; линтеры и типизатор и так целятся в нижнюю версию (3.12).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"
      # Экстры драйверов — чтобы тесты `@browser` шли, а не пропускались по importorskip.
      - run: uv sync --locked --all-extras
      # Браузеры Playwright — из кэша: скачивание и распаковка на Windows занимают минуты.
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: uv run playwright install --with-deps chromium
      # Системные библиотеки Chromium в кэш не попадают: на Linux ставятся каждый раз.
      - if: steps.browsers.outputs.cache-hit == 'true' && runner.os == 'Linux'
        run: uv run playwright install-deps chromium
      - run: uv run poe check

  versions:
    # Остальные поддерживаемые версии — то, что зависит от интерпретатора (как `poe matrix`):
    # поведение, список модулей stdlib, аннотации во время выполнения.
    # 3.13 — только Linux: браузерные прогоны дорогие, а платформенное покрыто крайними версиями.
    # Windows на 3.12 — без настоящего браузера: он от версии Python не зависит, а Windows с браузером
    # уже идёт в `check`; тесты на подставном драйвере проверяют всё, что зависит от интерпретатора.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.12", browser: true }
          - { os: windows-latest, python: "3.12", browser: false }
          - { os: ubuntu-latest, python: "3.13", browser: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras
      # Браузеры Playwright — из кэша: скачивание и распаковка на Windows занимают минуты.
      - uses: actions/cache@v4
        if: matrix.browser
        id: browsers
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - if: matrix.browser && steps.browsers.outputs.cache-hit != 'true'
        run: uv run playwright install --with-deps chromium
      # Системные библиотеки Chromium в кэш не попадают: на Linux ставятся каждый раз.
      - if: matrix.browser && steps.browsers.outputs.cache-hit == 'true' && runner.os == 'Linux'
        run: uv run playwright install-deps chromium
      - run: uv run poe stdlib
      - run: uv run poe docs
      - if: matrix.browser
        run: uv run poe test
      - if: ${{ !matrix.browser }}
        run: uv run poe test -m "not browser"

  site:
    # Сайт документации собирается без предупреждений: битые ссылки и ошибки разметки докстрингов.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --locked --all-extras --group docs
      - run: uv run poe prose
      - run: uv run poe site

  lowest:
    # Нижние границы зависимостей из pyproject.toml — обещание потребителю, а не догадка:
    # самые старые разрешённые версии на самом старом Python.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-extras --resolution lowest-direct
      # Браузеры Playwright — из кэша: скачивание и распаковка на Windows занимают минуты.
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-lowest-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: uv run playwright install --with-deps chromium
      # Системные библиотеки Chromium в кэш не попадают: на Linux ставятся каждый раз.
      - if: steps.browsers.outputs.cache-hit == 'true' && runner.os == 'Linux'
        run: uv run playwright install-deps chromium
      - run: uv run poe test

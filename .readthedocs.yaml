# Сборка сайта документации на Read the Docs.
# Окружение ставит uv из uv.lock: те же версии Sphinx и расширений, что локально в `poe site`.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --frozen --all-extras --group docs

sphinx:
  configuration: docs/conf.py
  # Как `-W` в `poe site`: битая ссылка или ошибка разметки роняет сборку.
  fail_on_warning: true
